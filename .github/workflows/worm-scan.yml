name: Worm scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  strix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — evil-merge detection needs the complete commit graph.
          fetch-depth: 0

      - uses: Ndevu12/strix@v0.1.3
